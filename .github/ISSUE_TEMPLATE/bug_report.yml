name: 问题反馈
description: 报告可以复现的错误，请使用脱敏数据。
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: '请先搜索已有 Issue。不要提交真实记录、个人路径、完整配置或带凭据的链接；安全漏洞请参阅 SECURITY.md。'
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Node.js 版本、项目版本或提交、使用的 Agent/浏览器。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用虚构项目与临时记录中心描述操作步骤。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志或截图（可选）
      description: 删除用户名、私人路径、记录正文、地址栏中的 token 和浏览器会话信息。
